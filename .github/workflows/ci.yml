name: Build & Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-convention:
    if: github.event_name == 'pull_request'
    uses: mitralab-dev/.github/.github/workflows/pr-title.yml@main

  build:
    needs: pr-convention
    if: ${{ !failure() && !cancelled() }}
    runs-on:
      group: mitra-ci
      labels: mitra-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
  test:
    runs-on:
      group: mitra-ci
      labels: mitra-ci
    needs: build
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
  sonar:
    runs-on:
      group: mitra-ci
      labels: mitra-ci
    needs: test
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
