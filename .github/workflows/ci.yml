name: Build & Test
on:
  push:
    branches: [alpha, main]
  pull_request:
    branches: [alpha, main]
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-convention:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qP "^(feat|fix|refactor|chore|docs)(\(.+\))?: .+ \(#[0-9]+\)$"; then
            echo "PR title is valid: $PR_TITLE"
          else
            echo "PR title does not match the expected pattern."
            echo ""
            echo "  type(scope): descricao (#issue)"
            echo ""
            echo "Examples:"
            echo "  feat(auth): implementar Google OAuth (#42)"
            echo "  fix(imports): timeout no chunk processing (#15)"
            echo "  chore: atualizar Spring Boot (#5)"
            echo ""
            echo "Types: feat, fix, refactor, chore, docs"
            echo "Scope: opcional"
            echo "Issue number: obrigatorio"
            exit 1
          fi

  build:
    needs: pr-convention
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require valid PR title
        if: ${{ needs.pr-convention.result != 'success' && needs.pr-convention.result != 'skipped' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke:package

  test:
    needs: [build, compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and compatibility
        if: ${{ needs.build.result != 'success' || needs.compatibility.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  compatibility:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  sonar:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
