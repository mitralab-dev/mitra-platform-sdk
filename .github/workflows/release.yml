name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0 or 1.1.0-beta.0)'
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Two release lines. main publishes stable versions on latest and prereleases on beta. The
      # all-tokens branch publishes only X.Y.Z-all-tokens.N on the all-tokens dist-tag: the field
      # it adds hands the app credentials wider than its own token and is opt-in for a few apps,
      # so it never reaches latest or beta (#147).
      - name: Validate branch
        if: github.ref_name != 'main' && github.ref_name != 'all-tokens'
        run: |
          echo "::error::Releases are only allowed from the main or the all-tokens branch."
          exit 1
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Version must use canonical semantic versioning, for example 1.1.0 or 1.1.0-beta.0."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "all-tokens" && ! "$VERSION" =~ -all-tokens\.[0-9]+$ ]]; then
            echo "::error::The all-tokens branch only publishes versions like 1.5.0-all-tokens.0."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "main" && "$VERSION" == *-all-tokens.* ]]; then
            echo "::error::all-tokens versions are published from the all-tokens branch, never from main."
            exit 1
          fi
          PRERELEASE="${VERSION#*-}"
          if [[ "$PRERELEASE" != "$VERSION" ]]; then
            IFS='.' read -ra IDENTIFIERS <<< "$PRERELEASE"
            for IDENTIFIER in "${IDENTIFIERS[@]}"; do
              if [[ "$IDENTIFIER" =~ ^0[0-9]+$ ]]; then
                echo "::error::Numeric prerelease identifiers cannot contain leading zeroes."
                exit 1
              fi
            done
          fi
  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
  bump:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set version
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version
      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push
          git push origin "v${{ github.event.inputs.version }}"
  publish:
    runs-on: ubuntu-latest
    needs: bump
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish all-tokens line
        if: contains(inputs.version, '-all-tokens.')
        run: npm publish --access public --tag all-tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish prerelease
        if: contains(inputs.version, '-') && !contains(inputs.version, '-all-tokens.')
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish stable release
        if: ${{ !contains(inputs.version, '-') }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
